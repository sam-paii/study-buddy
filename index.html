<style>
:root{--bg:#f4f1ea;--card:#fff;--text:#222a35;--muted:#667085;--accent:#3b5bdb;--accent-t:#fff;--line:#e0dccf;--bad:#c0392b;--ok:#2f8f55;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181e;--card:#1f242c;--text:#e8ecf2;--muted:#9aa4b2;--accent:#7c9cff;--accent-t:#0e1424;--line:#343b47;--bad:#ef7d6f;--ok:#4cbf7d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181e;--card:#1f242c;--text:#e8ecf2;--muted:#9aa4b2;--accent:#7c9cff;--accent-t:#0e1424;--line:#343b47;--bad:#ef7d6f;--ok:#4cbf7d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
main{max-width:720px;margin:0 auto;padding:16px 14px 60px}
h1{font-size:1.5rem;margin:4px 0 2px}h2{font-size:1.1rem;margin:20px 0 8px}
.muted{color:var(--muted);font-size:.9rem}
nav{display:flex;gap:6px;overflow-x:auto;margin:12px 0}
nav button{white-space:nowrap}
button,.btn{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 12px}
button.on,button.primary{background:var(--accent);color:var(--accent-t);border-color:var(--accent);font-weight:600}
button.link{border:0;background:none;color:var(--bad);padding:4px 6px;font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;border-left-width:5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;min-width:0}
form{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
form input[type=text]{flex:1 1 160px}
.pill{font-size:.78rem;padding:2px 8px;border-radius:99px;color:#fff;white-space:nowrap}
.when{font-size:.85rem;font-weight:600}
.late{color:var(--bad)}.soon{color:var(--accent)}
.files a{display:inline-block;margin:4px 8px 0 0;font-size:.9rem;color:var(--accent)}
.done .t{text-decoration:line-through;color:var(--muted)}
.banner{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;font-size:.88rem;margin:8px 0}
:root[data-theme="ocean"]{--bg:#e7f2f8;--card:#fff;--text:#10303f;--muted:#587889;--accent:#0a84c6;--accent-t:#fff;--line:#c6dde8;--bad:#c0392b;--ok:#1f9d6b;color-scheme:light}
:root[data-theme="sunset"]{--bg:#fff4e8;--card:#fffdf9;--text:#3a2418;--muted:#8a6a58;--accent:#e8590c;--accent-t:#fff;--line:#f1d9c2;--bad:#c0392b;--ok:#2f8f55;color-scheme:light}
:root[data-theme="forest"]{--bg:#10201a;--card:#182b23;--text:#e6f3ea;--muted:#8fb09e;--accent:#5fd08a;--accent-t:#08170f;--line:#2a4538;--bad:#ef7d6f;--ok:#5fd08a;color-scheme:dark}
:root[data-theme="midnight"]{--bg:#0f1020;--card:#191a33;--text:#ecebff;--muted:#9a9bc4;--accent:#9b8cff;--accent-t:#120f2a;--line:#2c2e52;--bad:#ff8a7a;--ok:#5fd7a0;color-scheme:dark}
body{font-size:var(--fs,16px)}main{padding-bottom:100px}
.card,.w,.hero,.banner{border-radius:var(--r,14px)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;margin:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);justify-content:flex-start;gap:2px}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;font-size:.7rem;padding:4px 10px;gap:2px;color:var(--muted);flex:0 0 auto}
nav button i{font-style:normal;font-size:1.3rem}nav button.on{background:none;color:var(--accent)}
@media(min-width:900px){nav{top:0;right:auto;bottom:auto;width:200px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:70px 10px 10px;overflow:auto;gap:4px}nav button{flex-direction:row;font-size:.95rem;width:100%;justify-content:flex-start;gap:10px;padding:10px;border-radius:10px}nav button.on{background:var(--accent);color:var(--accent-t)}main{margin-left:220px;max-width:900px;padding-bottom:30px}}
.hero{background:var(--accent);color:var(--accent-t);padding:18px}.hero h2{margin:0 0 4px;font-size:1.4rem}
.wg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.w{background:var(--card);border:1px solid var(--line);padding:14px}.w.wide{grid-column:1/-1}.w small{color:var(--muted);display:block}.w .n{font-size:1.9rem;font-weight:700;line-height:1.1;color:var(--accent);margin:4px 0}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-top:8px}.week div{background:var(--bg);border-radius:8px;padding:6px 2px}.week b{display:block;font-size:1rem}
.sw{width:34px;height:34px;border-radius:50%;padding:0;border:3px solid var(--line)}.sw.on{border-color:var(--text)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
details summary{cursor:pointer}
#auth{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}.authbox{width:100%;max-width:340px;text-align:center;display:flex;flex-direction:column;gap:10px}#auth.hide{display:none}

:root{--shadow:0 6px 24px rgba(30,40,80,.08);--shadow2:0 10px 30px rgba(30,40,80,.14)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--shadow:0 6px 24px rgba(0,0,0,.35);--shadow2:0 10px 30px rgba(0,0,0,.5)}}
body{background:radial-gradient(1100px 500px at 85% -10%,color-mix(in srgb,var(--accent) 16%,transparent),transparent),radial-gradient(800px 500px at -10% 15%,color-mix(in srgb,var(--accent) 9%,transparent),transparent),var(--bg);background-attachment:fixed;-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
::selection{background:var(--accent);color:var(--accent-t)}
h1,h2{letter-spacing:-.02em}h2{font-size:1.25rem;margin:26px 0 10px}
.brand{display:flex;align-items:center;gap:12px}.brand svg{width:46px;height:46px;border-radius:13px;box-shadow:var(--shadow)}.brand h1{margin:0;font-size:1.5rem}
#status{margin:8px 0 0;font-size:.82rem}
.card{border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-left-width:5px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s;animation:rise .3s ease both}
.card:hover{transform:translateY(-1px);box-shadow:var(--shadow2)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.w{box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}.w:hover{transform:translateY(-2px);box-shadow:var(--shadow2)}
.hero{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#ff6bd6));box-shadow:var(--shadow2);padding:22px}.hero h2{font-size:1.6rem;margin:0 0 6px}
button{transition:transform .1s,box-shadow .15s,background .15s,border-color .15s;border-radius:12px}button:active{transform:scale(.97)}
button.primary,button.on{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 65%,#a855f7));box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 38%,transparent)}
input,select,textarea{border-radius:12px;padding:10px 12px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
input[type=checkbox]{width:20px;height:20px;padding:0;accent-color:var(--accent)}
.pill{padding:3px 10px;font-weight:600}.banner{background:color-mix(in srgb,var(--card) 80%,transparent)}
.week div{box-shadow:inset 0 0 0 1px var(--line)}
nav{background:color-mix(in srgb,var(--card) 80%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 -4px 20px rgba(0,0,0,.06)}
nav button i{transition:transform .15s}nav button.on{background:none;box-shadow:none;color:var(--accent)}nav button.on i{transform:translateY(-2px) scale(1.15)}
@media(min-width:900px){nav{box-shadow:var(--shadow)}nav button.on{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 65%,#a855f7));color:var(--accent-t);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 35%,transparent)}nav button.on i{transform:none}nav button:hover:not(.on){background:color-mix(in srgb,var(--accent) 10%,transparent)}}
#auth{background:radial-gradient(800px 500px at 15% 0%,color-mix(in srgb,var(--accent) 30%,transparent),transparent),radial-gradient(700px 500px at 95% 100%,color-mix(in srgb,#ff6bd6 25%,transparent),transparent),var(--bg)}
.authbox{background:var(--card);padding:30px 24px;border-radius:24px;box-shadow:var(--shadow2);border:1px solid var(--line)}.authbox svg{width:84px;height:84px;margin:0 auto;border-radius:22px;box-shadow:var(--shadow2)}.authbox h1{margin:4px 0 0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Parchment / Ink themes, fonts, flowing background, fluid sizing ===== */
:root{--nw:clamp(190px,16vw,260px)}
:root[data-theme="parchment"]{--bg:#ece4d1;--card:#f5efe0;--text:#221c12;--muted:#776b54;--accent:#8a2b20;--accent-t:#f5efe0;--line:rgba(40,31,16,.16);--bad:#9c2f25;--ok:#3f6b3a;--blobB:#b18f37;--shadow:0 22px 44px -28px rgba(50,33,10,.5);--shadow2:0 26px 50px -26px rgba(50,33,10,.6);color-scheme:light}

body{font-size:1rem;font-family:var(--fb,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif);transition:background-color .5s,color .5s}

:root[data-theme="parchment"] h2,:root[data-theme="ink"] h2{font-size:1.5rem;font-weight:600}

button,input,select,textarea{font-family:inherit}
#bgflow{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;width:50vmax;height:50vmax;filter:blur(60px);opacity:.25;border-radius:46% 54% 60% 40%/44% 46% 54% 56%;animation:orbit 38s linear infinite;will-change:transform}

.blob.b2{background:var(--blobB,#ff6bd6);bottom:-20vmax;right:-12vmax;animation-duration:46s;animation-direction:reverse}
.blob.b3{background:var(--accent);width:34vmax;height:34vmax;top:35%;left:45%;opacity:.12;animation-duration:54s}
:root[data-theme="parchment"] .blob,:root[data-theme="ink"] .blob{opacity:.38}
@keyframes orbit{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(6vmax,4vmax) rotate(180deg) scale(1.08)}100%{transform:translate(0,0) rotate(360deg)}}
main{position:relative;z-index:1;max-width:min(1240px,100%)}
.card,.w,.banner{background:color-mix(in srgb,var(--card) 80%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.hero{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,var(--blobB,#ff6bd6)))}

:root[data-theme="blossom"]{--bg:#fff0f5;--card:#ffffff;--text:#33202a;--muted:#8a6573;--accent:#e0457b;--accent-t:#fff;--line:#f6d3df;--bad:#d64545;--ok:#2f9e6b;--blobB:#ffb454;--shadow:0 10px 30px -18px rgba(150,40,80,.4);--shadow2:0 16px 36px -18px rgba(150,40,80,.5);color-scheme:light}

:root[data-theme="graphite"]{--bg:#121316;--card:#1b1d22;--text:#eceef2;--muted:#9aa0ab;--accent:#8ab4ff;--accent-t:#0b1220;--line:#2d3038;--bad:#ff7b72;--ok:#4cc38a;--blobB:#5eead4;--shadow:0 20px 40px -24px rgba(0,0,0,.8);--shadow2:0 26px 50px -24px rgba(0,0,0,.9);color-scheme:dark}

input[type=range]{padding:0;height:22px;accent-color:var(--accent);background:transparent}

main{padding-top:10px}
.brand{margin:0 0 4px}.brand svg{width:34px;height:34px;border-radius:10px}.brand h1{font-size:1.15rem}

.qa{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px}.qa button{white-space:nowrap;flex:0 0 auto;border-radius:99px;padding:9px 16px;font-weight:600}

button:hover:not(:disabled),.btn:hover{transform:translateY(-1px) scale(1.02)}

.sh{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:7;animation:fade .2s}
.shb{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--card);border-radius:22px 22px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;box-shadow:var(--shadow2);animation:up .25s ease}

<body>
<div id="auth"><div class="authbox"><svg viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="lg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f6bff"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="url(#lg2)"/><path d="M96 188Q176 168 256 200V380Q176 348 96 368Z" fill="#fff"/><path d="M416 188Q336 168 256 200V380Q336 348 416 368Z" fill="#eef1ff"/><path d="M256 200V380" stroke="#c7d0ff" stroke-width="6"/><path d="M305 278L338 311L392 243" fill="none" stroke="#6d5ce8" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="M380 62L393 96L427 109L393 122L380 156L367 122L333 109L367 96Z" fill="#ffd166"/></svg><h1>Study Planner</h1><p class="muted">Log in or create an account</p><input id="au" type="email" placeholder="Email" autocomplete="email"><input id="ap" type="password" placeholder="Password (6+ characters)" autocomplete="current-password"><button class="primary" id="al">Log in</button><button id="ar">Create account</button><button id="af" class="link" style="color:var(--muted);text-align:center">Forgot password?</button><div id="am" class="muted"></div></div></div>

<div id="sheet"></div>
<main>
<div class="brand"><svg viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f6bff"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="url(#lg1)"/><path d="M96 188Q176 168 256 200V380Q176 348 96 368Z" fill="#fff"/><path d="M416 188Q336 168 256 200V380Q336 348 416 368Z" fill="#eef1ff"/><path d="M256 200V380" stroke="#c7d0ff" stroke-width="6"/><path d="M305 278L338 311L392 243" fill="none" stroke="#6d5ce8" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="M380 62L393 96L427 109L393 122L380 156L367 122L333 109L367 96Z" fill="#ffd166"/></svg><h1>Study Planner</h1></div>
<div id="status" class="muted">Loading…</div>

</main>
<script>
var S={subjects:[],tests:[],hw:[],files:[],notes:[],grades:[],sess:{},set:{},quick:"",g:{},cards:[],loot:[],tt:[],flog:[]},tab="home",db=null,assets=null,user=null,ref=null,me=null,timer=null,busy="";
var TABS=[["home","🏠 Home"],["plan","📅 Planner"],["subjects","🎓 Subjects"],["tt","🗓 Timetable"],["tests","📝 Tests"],["hw","📖 Homework"],["notes","🗒 Notes"],["files","📁 Files"],["grades","📊 Grades"],["focus","⏱ Focus"],["games","🎮 Games"],["cards","🃏 Cards"],["rew","🏆 Rewards"],["acct","👤 Account"],["set","⚙️ Settings"]];
var app=document.getElementById("app"),stat=document.getElementById("status");
function uid(){return Math.random().toString(36).slice(2,10)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function iso(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
function daysTo(d){return Math.round((new Date(d+"T00:00")-new Date(iso(new Date())+"T00:00"))/864e5)}
function when(d){var n=daysTo(d),t=new Date(d+"T00:00").toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
var l=n<0?Math.abs(n)+" day"+(n==-1?"":"s")+" ago":n==0?"Today":n==1?"Tomorrow":"in "+n+" days";
return '<span class="when '+(n<0?"late":n<=3?"soon":"")+'">'+t+" · "+l+"</span>"}
function sub(id){return S.subjects.find(function(s){return s.id===id})}
function pill(id){var s=sub(id);return s?'<span class="pill" style="background:'+esc(s.color)+'">'+esc(s.name)+"</span>":'<span class="muted">No subject</span>'}
function opts(sel){return '<option value="">No subject</option>'+S.subjects.map(function(s){return '<option value="'+s.id+'"'+(s.id===sel?" selected":"")+">"+esc(s.name)+"</option>"}).join("")}
function save(){if(!cur||!FB)return;clearTimeout(timer);stat.textContent="Saving…";timer=setTimeout(function(){FB.F.setDoc(FB.F.doc(FB.db,"users",cur),{json:JSON.stringify(S),updated:Date.now()}).then(function(){stat.textContent="✓ Saved to your account"}).catch(function(e){stat.textContent="⚠ Could not save: "+(e.code||e.message)})},400)}
function fileBlock(kind,r){var fl=S.files.filter(function(f){return f.kind===kind&&f.ref===r});
var h='<div class="files">'+fl.map(function(f){return '<a href="#" data-blob="'+f.aid+'">📎 '+esc(f.name)+'</a><button class="link" data-act="delfile" data-id="'+f.id+'">remove</button>'}).join("")+"</div>";
if(assets)h+='<label class="btn" style="display:inline-block;margin-top:8px;font-size:.85rem">＋ Attach file (this device only)<input type="file" multiple hidden data-up="'+kind+":"+r+'"></label>';
return h}
function testCard(t){return '<div class="card" style="border-left-color:'+((sub(t.sub)||{}).color||"var(--line)")+'"><div class="row"><b>'+esc(t.title)+'</b>'+pill(t.sub)+'<span class="sp"></span>'+when(t.date)+'<button class="link" data-act="deltest" data-id="'+t.id+'">delete</button></div>'+'<textarea data-tn="'+t.id+'" rows="3" style="width:100%;margin-top:8px" placeholder="Study notes, topics, things to revise…">'+esc(t.notes||"")+'</textarea><b style="font-size:.85rem;display:block;margin-top:8px">📎 Study files and notes</b>'+fileBlock("test",t.id)+"</div>"}
function hwCard(h){return '<div class="card'+(h.done?" done":"")+'" style="border-left-color:'+((sub(h.sub)||{}).color||"var(--line)")+'"><div class="row"><input type="checkbox" data-act="tog" data-id="'+h.id+'"'+(h.done?" checked":"")+'><b class="t">'+esc(h.title)+'</b>'+(h.pri===3?'<span title="High priority">🔴</span>':h.pri===1?'<span title="Low priority">🟢</span>':"")+pill(h.sub)+'<span class="sp"></span>'+when(h.date)+'<button class="link" data-act="delhw" data-id="'+h.id+'">delete</button></div>'+fileBlock("hw",h.id)+"</div>"}
function view(){
if(tab==="home"){var nm=S.set.name||(me&&me.name)||"there",hr=new Date().getHours(),nt=S.tests.filter(t=>daysTo(t.date)>=0).sort((a,b)=>a.date<b.date?-1:1)[0],due=S.hw.filter(h=>!h.done&&daysTo(h.date)<=0).length,todo=S.hw.filter(h=>!h.done).length,sc=0,ot=0,wk="",TP=["Study in short bursts, then take a 5 minute break.","Test yourself instead of rereading.","Explain it out loud as if you were teaching a friend.","Sleep helps your brain store what you learned.","Start with the hardest subject while you are fresh."];
S.grades.forEach(g=>{sc+=g.score;ot+=g.out});
for(var i=0;i<7;i++){var d=new Date();d.setDate(d.getDate()+i);var k=iso(d),c=S.tests.filter(t=>t.date===k).length+S.hw.filter(x=>!x.done&&x.date===k).length;wk+='<div><small>'+d.toLocaleDateString(undefined,{weekday:"short"})+'</small><b>'+d.getDate()+'</b>'+(c?'<span class="pill" style="background:var(--accent)">'+c+'</span>':"·")+'</div>'}
var w=(k,h)=>wOn(k)?h:"";
return '<div class="hero"><h2>'+(hr<12?"Good morning":hr<18?"Good afternoon":"Good evening")+", "+esc(nm)+' 👋</h2><div style="opacity:.85">'+new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"})+'</div></div><div class="qa"><button data-act="tab" data-id="hw">＋ Homework</button><button data-act="tab" data-id="tests">＋ Test</button><button data-act="tab" data-id="notes">＋ Note</button><button data-act="tab" data-id="games">🎮 Quiz</button><button data-act="tab" data-id="focus">⏱ Focus</button></div><div class="wg">'
+w("next",'<div class="w"><small>Next test</small><div class="n">'+(nt?(daysTo(nt.date)==0?"Today":daysTo(nt.date)+"d"):"–")+'</div><small>'+(nt?esc(nt.title):"None planned")+'</small></div>')
+w("due",'<div class="w"><small>Homework due</small><div class="n">'+due+'</div><small>'+todo+' to do in total</small></div>')
